<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON SWARM</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05060d;overflow:hidden;font-family:system-ui,"Segoe UI",sans-serif;color:#cfefff;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.panel{pointer-events:auto;background:rgba(8,12,30,.93);border:2px solid #0ff;border-radius:14px;box-shadow:0 0 36px #0ff6,inset 0 0 24px #0ff2;padding:26px;text-align:center;width:min(620px,94vw);max-height:94vh;overflow:auto}
[hidden]{display:none!important}
h1{margin:0;font-size:clamp(34px,7vw,56px);letter-spacing:4px;color:#0ff;text-shadow:0 0 18px #0ff,0 0 40px #08f}
h2{margin:0 0 10px;color:#f0f;text-shadow:0 0 12px #f0f;letter-spacing:3px}
p{margin:8px 0;color:#8fd}
.hint{font-size:13px;opacity:.7}
button{font:700 17px system-ui,sans-serif;background:rgba(0,255,255,.06);color:#0ff;border:2px solid #0ff;border-radius:9px;padding:10px 20px;margin:6px;cursor:pointer;box-shadow:0 0 14px #0ff5;text-shadow:0 0 8px #0ff}
button:hover:not(:disabled){background:rgba(0,255,255,.2)}
button:disabled{opacity:.35;cursor:default;box-shadow:none}
.stat{display:flex;justify-content:space-around;flex-wrap:wrap;margin:14px 0;font-size:14px}
.stat b{display:block;font-size:22px;color:#ff0;text-shadow:0 0 10px #ff0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0;padding:8px 12px;border:1px solid #0ff4;border-radius:8px;text-align:left}
.cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.card{width:180px;min-height:160px;text-align:left;margin:0;padding:14px;color:#cfefff;border-color:#f0f;box-shadow:0 0 16px #f0f5;background:rgba(255,0,255,.06);white-space:normal;font-weight:600}
.card span{display:block;font-size:12px;font-weight:400;color:#9cf;margin-top:6px;line-height:1.35}
.card em{font-style:normal;color:#ff0;font-size:12px}
</style></head>
<body><canvas id="c"></canvas>
<div id="ui">
 <div class="panel" id="menu">
  <h1>NEON SWARM</h1><p>Survive the grid. Your weapons fire themselves.</p>
  <div class="stat"><div>HIGH SCORE<b id="mHi">0</b></div><div>LONGEST<b id="mLo">0:00</b></div><div>COINS<b id="mCo">0</b></div></div>
  <button id="bPlay">START RUN</button><button id="bShop">PERMANENT UPGRADES</button>
  <p class="hint">WASD / Arrows, or drag anywhere · Level up to pick upgrades · A boss arrives every 60s</p>
 </div>
 <div class="panel" id="shop" hidden><h2>PERMANENT UPGRADES</h2><p>Coins: <b id="sCo" style="color:#ff0"></b></p><div id="rows"></div><button id="bBack">BACK</button></div>
 <div class="panel" id="draft" hidden><h2>LEVEL UP</h2><p>Pick an upgrade (1 / 2 / 3)</p><div class="cards" id="cards"></div></div>
 <div class="panel" id="over" hidden><h1 style="font-size:40px">GAME OVER</h1><div class="stat" id="oStats"></div><button id="bAgain">PLAY AGAIN</button><button id="bMenu">MENU</button></div>
</div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),X=cv.getContext('2d');
let W,H;const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};addEventListener('resize',rs);rs();
const SK='neonswarm-v1';
let M=Object.assign({hi:0,lo:0,co:0,up:{spd:0,xp:0,hp:0}},JSON.parse(localStorage.getItem(SK)||'{}'));
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(M))}catch(e){}};
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');

/* ---------- Audio (Web Audio, no files) ---------- */
let AC;const A=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
function tn(f,d,ty='square',v=.06,sl=0){try{const a=A(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}catch(e){}}
function nz(d,v=.2){try{const a=A(),n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n)**2;const s=a.createBufferSource(),g=a.createGain();g.gain.value=v;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
let lastL=0,combo=0,lastC=0;
const sfx={
 laser(){const n=performance.now();if(n-lastL<70)return;lastL=n;tn(980,.12,'sawtooth',.025,-760)},
 chime(){const n=performance.now();combo=n-lastC<700?combo+1:0;lastC=n;tn(520+Math.min(combo,24)*38,.12,'sine',.07)},
 boom(b){nz(b?.6:.22,b?.35:.14);tn(b?90:160,b?.5:.2,'triangle',.2,-100)},
 hit(){tn(300,.05,'square',.03,-150)},
 lvl(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tn(f,.25,'triangle',.1),i*70));tn(110,.7,'sawtooth',.28,-80)},
 hurt(){tn(140,.25,'sawtooth',.12,-90)},
 zap(){nz(.08,.06);tn(1600,.08,'square',.03,-1200)}
};

/* ---------- Data ---------- */
const TY={drone:{r:12,hp:14,sp:58,c:'#f0f',x:1},dash:{r:10,hp:10,sp:80,c:'#ff0',x:2},shield:{r:19,hp:90,sp:36,c:'#fa0',x:4},kami:{r:13,hp:20,sp:100,c:'#f44',x:2}};
const UP=[
{id:'blade',n:'Orbiting Plasma Blades',d:'A plasma blade orbits you and burns foes it touches.',m:6},
{id:'chain',n:'Chain Lightning Arcs',d:'Lightning leaps between nearby foes every few seconds.',m:6},
{id:'ric',n:'Ricochet Shurikens',d:'Hurls shurikens that bounce from enemy to enemy.',m:6},
{id:'rail',n:'Piercing Railgun',d:'Fires a beam that pierces every enemy in its line.',m:6},
{id:'mag',n:'Magnet Radius',d:'XP shards are pulled from much farther away.',m:6},
{id:'spd',n:'Movement Speed',d:'+8% move speed per level.',m:6},
{id:'fr',n:'Fire Rate',d:'All weapons reload 12% faster.',m:6},
{id:'cr',n:'Crit Multiplier',d:'+10% crit chance. Crits deal double damage.',m:6},
{id:'hp',n:'Reinforced Plating',d:'+25 max HP and an instant repair.',m:99},
{id:'rg',n:'Nano Regen',d:'Repairs 1.5 HP per second.',m:6}];
const SHOP=[{k:'spd',n:'Starting Speed',d:'+5% move speed per level',b:60},{k:'xp',n:'XP Gain',d:'+10% XP per level',b:50},{k:'hp',n:'Max HP',d:'+10 max HP per level',b:50}];

/* ---------- Run state ---------- */
let st='menu',T=0,kills=0,lv=1,xp=0,need=12,pend=0,shake=0,acc=0,bossN=0,bossKills=0,nxtBoss=60,drag=null,pd=null,curPick=null;
let LV={blade:0,chain:0,ric:0,rail:0,mag:0,spd:0,fr:0,cr:0,hp:0,rg:0};
let WT={chain:0,ric:0,rail:0};
let P={x:0,y:0,hp:100,inv:0,face:0},E=[],G=[],PT=[],TX=[],SH=[],RB=[],BOLT=[],CH=null,K={};
const nd=l=>Math.floor(12+l*9+l*l*1.2);
const mhp=()=>100+10*(M.up.hp||0)+25*LV.hp;
const spdM=()=>(1+.05*(M.up.spd||0))*(1+.08*LV.spd);
const xpM=()=>1+.1*(M.up.xp||0);
const magR=()=>90*(1+.4*LV.mag);
const frM=()=>Math.pow(.88,LV.fr);
const critC=()=>.05+.1*LV.cr;
function pan(id){['menu','shop','draft','over'].forEach(p=>$(p).hidden=p!==id)}

function run(){
 LV={blade:0,chain:0,ric:0,rail:0,mag:0,spd:0,fr:0,cr:0,hp:0,rg:0};
 WT={chain:0,ric:0,rail:0};
 P={x:0,y:0,hp:mhp(),inv:0,face:0};
 E=[];G=[];PT=[];TX=[];SH=[];RB=[];BOLT=[];CH=null;
 T=0;kills=0;bossKills=0;lv=1;xp=0;need=nd(1);pend=0;shake=0;acc=0;bossN=0;nxtBoss=60;
 st='play';pan(null);
}

/* ---------- Helpers ---------- */
function near(x,y,r,ex){let b=null,bd=r*r;for(const e of E){if(e.dead||(ex&&ex.has(e)))continue;const d=(e.x-x)**2+(e.y-y)**2;if(d<bd){bd=d;b=e}}return b}
function segD(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy||1;let t=((px-ax)*dx+(py-ay)*dy)/l2;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(ax+dx*t),py-(ay+dy*t))}
function burst(x,y,c,n,sp){for(let i=0;i<n&&PT.length<500;i++){const a=Math.random()*6.283,v=Math.random()*sp,l=.4+Math.random()*.4;PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:l,m:l,c,s:2+Math.random()*3})}}
function txt(x,y,s,c,big){TX.push({x,y,s,c,big,life:.8})}

/* ---------- Spawning ---------- */
function ringPos(){const a=Math.random()*6.283,d=Math.max(W,H)*.55+80;return[P.x+Math.cos(a)*d,P.y+Math.sin(a)*d]}
function spawnE(k){const t=TY[k],[x,y]=ringPos(),m=1+T/110;E.push({k,x,y,r:t.r,sp:t.sp,c:t.c,xp:t.x,hp:t.hp*m,mhp:t.hp*m,fl:0,cd:Math.random()*2,dash:0,dx:0,dy:0,bcd:0,dead:0})}
function spawnRand(){
 const pool=[['drone',1],['dash',T>25?.6:0],['shield',T>50?.3:0],['kami',T>75?.4:0]];
 let r=Math.random()*pool.reduce((s,p)=>s+p[1],0);
 for(const[k,w]of pool){r-=w;if(r<0){spawnE(k);return}}
}
function spawnBoss(){
 bossN++;const[x,y]=ringPos(),hp=900*bossN+150*bossN*bossN;
 E.push({k:'boss',boss:1,x,y,r:46,sp:40,c:'#f0a',xp:30,hp,mhp:hp,fl:0,bcd:0,dead:0,lt:3,tele:0,aim:0,fire:0,fx:0,fy:0});
 txt(P.x,P.y-140,'BOSS INBOUND','#f0a',true);sfx.lvl();
}

/* ---------- Combat ---------- */
function hitE(e,base){
 const cr=Math.random()<critC(),d=Math.round(base*(cr?2:1));
 e.hp-=d;e.fl=.08;
 txt(e.x+(Math.random()-.5)*14,e.y-e.r-4,String(d),cr?'#ff2a3d':'#ffe14a',cr);
 if(cr)shake=Math.min(20,shake+2);
 if(e.hp<=0)killE(e);
 else{if(Math.random()<.5)burst(e.x,e.y,e.c,2,90);if(Math.random()<.15)sfx.hit()}
}
function killE(e){
 if(e.dead)return;e.dead=1;kills++;
 burst(e.x,e.y,e.c,e.boss?90:12,e.boss?380:200);
 shake=Math.min(22,shake+(e.boss?18:2.2));sfx.boom(e.boss);
 const gn=e.boss?25:1;
 for(let i=0;i<gn&&G.length<700;i++)G.push({x:e.x+(Math.random()-.5)*(e.boss?120:6),y:e.y+(Math.random()-.5)*(e.boss?120:6),v:e.boss?1.5:e.xp});
 if(e.boss){bossKills++;CH={x:e.x,y:e.y,life:30};txt(e.x,e.y-70,'BOSS DOWN','#f0a',true)}
}
function hurtP(d){
 if(P.inv>0||st!=='play')return;
 P.inv=.55;P.hp-=d;shake=Math.min(22,shake+7);sfx.hurt();
 if(P.hp<=0){P.hp=0;over()}
}
function castChain(){
 let c=near(P.x,P.y,520),hit=new Set(),pts=[[P.x,P.y]];const n=2+LV.chain;
 for(let i=0;c&&i<n;i++){hit.add(c);pts.push([c.x,c.y]);hitE(c,14+4*LV.chain);c=near(c.x,c.y,240,hit)}
 BOLT.push({p:pts,life:.22});sfx.zap();
}

/* ---------- Upgrades ---------- */
function openDraft(){
 st='draft';
 const pool=UP.filter(u=>(LV[u.id]||0)<u.m),pick=[];
 while(pick.length<3&&pool.length)pick.push(pool.splice(Math.random()*pool.length|0,1)[0]);
 curPick=pick;
 const cd=$('cards');cd.innerHTML='';
 pick.forEach((u,i)=>{const b=document.createElement('button');b.className='card';
  b.innerHTML=`<em>[${i+1}] ${LV[u.id]?'LV '+(LV[u.id]+1):'NEW'}</em><br><b>${u.n}</b><span>${u.d}</span>`;
  b.onclick=()=>pickUp(u);cd.appendChild(b)});
 pan('draft');sfx.lvl();
}
function pickUp(u){
 LV[u.id]++;if(u.id==='hp')P.hp+=25;
 pend--;
 if(pend>0)openDraft();else{st='play';pan(null)}
}

/* ---------- Update ---------- */
function upd(dt){
 T+=dt;shake*=Math.pow(.02,dt);
 let mx=0,my=0;
 if(drag&&(drag.x||drag.y)){mx=drag.x;my=drag.y}
 else{mx=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0);my=(K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0);const l=Math.hypot(mx,my)||1;mx/=l;my/=l}
 const sp=190*spdM();P.x+=mx*sp*dt;P.y+=my*sp*dt;
 if(mx||my)P.face=Math.atan2(my,mx);
 P.inv-=dt;P.hp=Math.min(mhp(),P.hp+LV.rg*1.5*dt);

 // spawning
 acc-=dt;const iv=Math.max(.12,1.1-T/170);
 while(acc<=0&&E.length<320){acc+=iv;spawnRand()}
 if(T>=nxtBoss){spawnBoss();nxtBoss+=60}

 // enemies
 for(const e of E){
  if(e.dead)continue;
  e.fl-=dt;e.bcd-=dt;
  const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
  let ux=dx/d,uy=dy/d,mv=e.sp;
  if(e.boss){
   e.x+=ux*e.sp*dt;e.y+=uy*e.sp*dt;
   e.lt-=dt;
   if(e.lt<=0&&e.tele<=0&&e.fire<=0){e.tele=1.1;e.lt=3.6}
   if(e.tele>0){e.tele-=dt;e.aim=Math.atan2(dy,dx);
    if(e.tele<=0){e.fire=.45;e.fx=Math.cos(e.aim);e.fy=Math.sin(e.aim);sfx.zap();shake=Math.min(22,shake+10)}}
   if(e.fire>0){e.fire-=dt;if(segD(P.x,P.y,e.x,e.y,e.x+e.fx*1500,e.y+e.fy*1500)<18)hurtP(26)}
   if(d<e.r+12)hurtP(15);
   continue;
  }
  if(e.k==='dash'){
   e.cd-=dt;
   if(e.dash>0){e.dash-=dt;ux=e.dx;uy=e.dy;mv=380}
   else if(e.cd<=0){e.cd=2.4;e.dash=.45;e.dx=ux;e.dy=uy}
  }
  e.x+=ux*mv*dt;e.y+=uy*mv*dt;
  if(e.k==='kami'){if(d<e.r+14){e.dead=1;burst(e.x,e.y,'#f44',30,260);sfx.boom(false);shake=Math.min(22,shake+5);hurtP(18)}}
  else if(d<e.r+12)hurtP(e.k==='shield'?12:8);
 }

 // blades (orbit)
 const nb=LV.blade;
 for(let i=0;i<nb;i++){
  const a=T*2.6+i*6.283/nb,R=58+LV.blade*3,bx=P.x+Math.cos(a)*R,by=P.y+Math.sin(a)*R;
  for(const e of E){if(e.dead||e.bcd>0)continue;if(Math.hypot(e.x-bx,e.y-by)<e.r+8){e.bcd=.3;hitE(e,12+3*LV.blade)}}
 }

 // chain lightning
 if(LV.chain){WT.chain-=dt;if(WT.chain<=0&&near(P.x,P.y,520)){WT.chain=1.8*frM();castChain()}}

 // ricochet shurikens
 if(LV.ric){WT.ric-=dt;if(WT.ric<=0){const t=near(P.x,P.y,700);if(t){WT.ric=.85*frM();const a=Math.atan2(t.y-P.y,t.x-P.x);
  for(let i=0;i<LV.ric;i++){const b=a+(i-(LV.ric-1)/2)*.2;SH.push({x:P.x,y:P.y,vx:Math.cos(b)*520,vy:Math.sin(b)*520,b:2+(LV.ric>>1),life:2.6,hit:new Set()})}
  sfx.laser()}}}
 for(const s of SH){
  s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.a=(s.a||0)+dt*20;
  for(const e of E){
   if(e.dead||s.hit.has(e))continue;
   if(Math.hypot(e.x-s.x,e.y-s.y)<e.r+7){
    s.hit.add(e);hitE(e,11);
    if(s.b-->0){const n=near(s.x,s.y,380,s.hit);if(n){const a=Math.atan2(n.y-s.y,n.x-s.x);s.vx=Math.cos(a)*520;s.vy=Math.sin(a)*520}else s.life=0}
    else s.life=0;
    break;
   }
  }
 }
 SH=SH.filter(s=>s.life>0);

 // railgun
 if(LV.rail){WT.rail-=dt;if(WT.rail<=0){const t=near(P.x,P.y,760);if(t){
  WT.rail=2.1*frM();const a=Math.atan2(t.y-P.y,t.x-P.x),ex=P.x+Math.cos(a)*1200,ey=P.y+Math.sin(a)*1200,dmg=28+14*LV.rail;
  for(const e of E){if(!e.dead&&segD(e.x,e.y,P.x,P.y,ex,ey)<e.r+4)hitE(e,dmg)}
  RB.push({x1:P.x,y1:P.y,x2:ex,y2:ey,life:.22});sfx.zap();shake=Math.min(22,shake+3)}}}

 // gems
 const mr=magR();
 for(const g of G){
  const dx=P.x-g.x,dy=P.y-g.y,d=Math.hypot(dx,dy)||1;
  if(d<mr){g.x+=dx/d*420*dt;g.y+=dy/d*420*dt}
  if(d<24){xp+=g.v*xpM();sfx.chime();g.dead=1}
 }
 G=G.filter(g=>!g.dead);
 while(xp>=need){xp-=need;lv++;need=nd(lv);pend++}

 // chest
 if(CH){CH.life-=dt;if(CH.life<=0)CH=null;else if(Math.hypot(P.x-CH.x,P.y-CH.y)<40){CH=null;pend++;txt(P.x,P.y-60,'CHEST! FREE UPGRADE','#fc0',true);M.co+=15}}

 // effects
 for(const p of PT){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.05,dt);p.vy*=Math.pow(.05,dt)}
 PT=PT.filter(p=>p.life>0);
 for(const t of TX){t.life-=dt;t.y-=40*dt}
 TX=TX.filter(t=>t.life>0);
 for(const b of BOLT)b.life-=dt;BOLT=BOLT.filter(b=>b.life>0);
 for(const r of RB)r.life-=dt;RB=RB.filter(r=>r.life>0);

 E=E.filter(e=>!e.dead);
 if(pend>0&&st==='play')openDraft();
}

/* ---------- Render ---------- */
function poly(x,y,r,n,rot){X.beginPath();for(let i=0;i<=n;i++){const a=rot+i*6.283/n;X.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}X.stroke()}
function draw(){
 const jx=(Math.random()-.5)*shake,jy=(Math.random()-.5)*shake,cx=P.x-W/2+jx,cy=P.y-H/2+jy;
 const S=(x,y)=>[x-cx,y-cy];
 X.shadowBlur=0;X.fillStyle='#05060d';X.fillRect(0,0,W,H);
 X.strokeStyle='rgba(0,255,255,.1)';X.lineWidth=1;X.beginPath();
 const g=90,ox=((-cx)%g+g)%g,oy=((-cy)%g+g)%g;
 for(let x=ox;x<W;x+=g){X.moveTo(x,0);X.lineTo(x,H)}
 for(let y=oy;y<H;y+=g){X.moveTo(0,y);X.lineTo(W,y)}
 X.stroke();
 if(st==='menu'||!P)return;

 // gems
 X.fillStyle='#0ff';X.shadowColor='#0ff';X.shadowBlur=10;
 for(const gm of G){const[x,y]=S(gm.x,gm.y);X.beginPath();X.moveTo(x,y-5);X.lineTo(x+4,y);X.lineTo(x,y+5);X.lineTo(x-4,y);X.fill()}

 // chest
 if(CH){const[x,y]=S(CH.x,CH.y),p=.5+.5*Math.sin(T*6);X.shadowColor='#fc0';X.shadowBlur=20+p*20;X.fillStyle='#fc0';X.fillRect(x-12,y-9,24,18);X.strokeStyle='#fff';X.lineWidth=2;X.strokeRect(x-12,y-9,24,18)}

 // enemies
 for(const e of E){
  const[x,y]=S(e.x,e.y);
  X.strokeStyle=e.fl>0?'#fff':e.c;X.shadowColor=e.c;X.shadowBlur=e.boss?30:12;X.lineWidth=e.boss?4:2;
  if(e.k==='drone')poly(x,y,e.r,12,0);
  else if(e.k==='dash')poly(x,y,e.r,3,Math.atan2(P.y-e.y,P.x-e.x));
  else if(e.k==='shield')poly(x,y,e.r,4,T*.8+Math.PI/4);
  else if(e.k==='kami')poly(x,y,e.r*(1+.25*Math.sin(T*14)),6,T*3);
  else{
   poly(x,y,e.r*(1+.03*Math.sin(T*4)),8,T*.5);poly(x,y,e.r*.5,6,-T);
   if(e.tele>0){X.setLineDash([12,10]);X.strokeStyle='rgba(255,60,120,.85)';X.lineWidth=2+(1.1-e.tele)*10;X.beginPath();X.moveTo(x,y);X.lineTo(x+Math.cos(e.aim)*1500,y+Math.sin(e.aim)*1500);X.stroke();X.setLineDash([])}
   if(e.fire>0){X.shadowColor='#f0a';X.strokeStyle='#f0a';X.lineWidth=40;X.globalAlpha=.45;X.beginPath();X.moveTo(x,y);X.lineTo(x+e.fx*1500,y+e.fy*1500);X.stroke();X.globalAlpha=1;X.strokeStyle='#fff';X.lineWidth=14;X.beginPath();X.moveTo(x,y);X.lineTo(x+e.fx*1500,y+e.fy*1500);X.stroke()}
  }
 }

 // blades
 for(let i=0;i<LV.blade;i++){const a=T*2.6+i*6.283/LV.blade,R=58+LV.blade*3,[x,y]=S(P.x+Math.cos(a)*R,P.y+Math.sin(a)*R);X.shadowColor='#0ff';X.shadowBlur=16;X.fillStyle='#bff';X.beginPath();X.arc(x,y,6,0,6.283);X.fill()}

 // shurikens
 X.shadowColor='#0ff';X.strokeStyle='#0ff';X.lineWidth=2;
 for(const s of SH){const[x,y]=S(s.x,s.y);X.save();X.translate(x,y);X.rotate(s.a);poly(0,0,6,4,0);X.restore()}

 // rail beams
 for(const r of RB){const[x1,y1]=S(r.x1,r.y1),[x2,y2]=S(r.x2,r.y2);X.globalAlpha=Math.max(0,r.life/.22);X.shadowColor='#0ff';X.strokeStyle='#0ff';X.lineWidth=14;X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.stroke();X.strokeStyle='#fff';X.lineWidth=4;X.stroke();X.globalAlpha=1}

 // chain bolts
 X.shadowColor='#8ff';X.strokeStyle='#bff';X.lineWidth=2.5;
 for(const b of BOLT){X.globalAlpha=Math.max(0,b.life/.22);X.beginPath();for(let i=0;i<b.p.length-1;i++){const[ax,ay]=S(b.p[i][0],b.p[i][1]),[bx,by]=S(b.p[i+1][0],b.p[i+1][1]);X.moveTo(ax,ay);for(let k=1;k<6;k++){const t=k/6;X.lineTo(ax+(bx-ax)*t+(Math.random()-.5)*16,ay+(by-ay)*t+(Math.random()-.5)*16)}X.lineTo(bx,by)}X.stroke()}
 X.globalAlpha=1;

 // particles
 X.shadowBlur=0;
 for(const p of PT){const[x,y]=S(p.x,p.y);X.globalAlpha=Math.max(0,p.life/p.m);X.fillStyle=p.c;X.fillRect(x-p.s/2,y-p.s/2,p.s,p.s)}
 X.globalAlpha=1;

 // player
 const[px,py]=S(P.x,P.y);
 if(P.inv<=0||Math.floor(T*20)%2){X.shadowColor='#0ff';X.shadowBlur=18;X.strokeStyle='#0ff';X.lineWidth=2.5;X.save();X.translate(px,py);X.rotate(P.face);X.beginPath();X.moveTo(14,0);X.lineTo(-10,-9);X.lineTo(-5,0);X.lineTo(-10,9);X.closePath();X.stroke();X.restore()}

 // floating text
 X.textAlign='center';
 for(const t of TX){const[x,y]=S(t.x,t.y);X.globalAlpha=Math.min(1,t.life*2);X.font=`900 ${t.big?28:16}px system-ui`;X.shadowColor=t.c;X.shadowBlur=10;X.fillStyle=t.c;X.fillText(t.s,x,y)}
 X.globalAlpha=1;X.shadowBlur=0;X.textAlign='left';

 // HUD
 X.fillStyle='rgba(0,255,255,.15)';X.fillRect(0,0,W,8);
 X.fillStyle='#0ff';X.shadowColor='#0ff';X.shadowBlur=12;X.fillRect(0,0,W*Math.min(1,xp/need),8);X.shadowBlur=0;
 X.font='bold 18px system-ui';X.fillStyle='#cfefff';
 X.fillText(`LV ${lv}`,14,34);
 X.textAlign='center';X.fillText(fmt(T),W/2,34);
 X.textAlign='right';X.fillText(`KILLS ${kills}`,W-14,34);X.textAlign='left';
 X.fillStyle='#222';X.fillRect(14,H-34,220,14);
 X.fillStyle=P.hp>mhp()*.3?'#3f3':'#f33';X.fillRect(14,H-34,220*Math.max(0,P.hp)/mhp(),14);
 const b=E.find(e=>e.boss&&!e.dead);
 if(b){X.fillStyle='#222';X.fillRect(W/2-240,50,480,12);X.fillStyle='#f0a';X.shadowColor='#f0a';X.shadowBlur=10;X.fillRect(W/2-240,50,480*Math.max(0,b.hp)/b.mhp,12);X.shadowBlur=0}
}

/* ---------- Loop ---------- */
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(st==='play')upd(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* ---------- Over / Menu / Shop ---------- */
function over(){
 st='over';
 const coins=Math.floor(kills/4)+Math.floor(T/12)+bossKills*15+lv*2,score=kills*10+Math.floor(T)*3+lv*25;
 M.co+=coins;M.lo=Math.max(M.lo,T);const hi=score>M.hi;if(hi)M.hi=score;save();
 $('oStats').innerHTML=`<div>SCORE<b>${score}</b></div><div>SURVIVED<b>${fmt(T)}</b></div><div>KILLS<b>${kills}</b></div><div>LEVEL<b>${lv}</b></div><div>COINS +<b>${coins}</b></div>`+(hi?'<p style="color:#ff0;width:100%">NEW HIGH SCORE!</p>':'');
 pan('over');
}
function menuStats(){$('mHi').textContent=M.hi;$('mLo').textContent=fmt(M.lo);$('mCo').textContent=M.co}
function shopUI(){
 $('sCo').textContent=M.co;$('rows').innerHTML='';
 SHOP.forEach(s=>{
  const l=M.up[s.k]||0,c=s.b*(l+1),r=document.createElement('div');r.className='row';
  r.innerHTML=`<div><b>${s.n}</b> <span style="color:#ff0">Lv ${l}/5</span><br><small>${s.d}</small></div>`;
  const b=document.createElement('button');b.textContent=l>=5?'MAX':`BUY ${c}`;b.disabled=l>=5||M.co<c;
  b.onclick=()=>{M.co-=c;M.up[s.k]=l+1;save();shopUI()};
  r.appendChild(b);$('rows').appendChild(r);
 });
}
$('bPlay').onclick=()=>{A();run()};
$('bShop').onclick=()=>{shopUI();pan('shop')};
$('bBack').onclick=()=>{menuStats();pan('menu')};
$('bAgain').onclick=()=>{A();run()};
$('bMenu').onclick=()=>{menuStats();st='menu';pan('menu')};
menuStats();pan('menu');

/* ---------- Input ---------- */
addEventListener('keydown',e=>{
 K[e.code]=1;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
 if(st==='draft'&&curPick){const u=curPick[+e.key-1];if(u)pickUp(u)}
});
addEventListener('keyup',e=>{delete K[e.code]});
cv.addEventListener('pointerdown',e=>{A();if(st!=='play')return;pd={x:e.clientX,y:e.clientY};drag={x:0,y:0}});
addEventListener('pointermove',e=>{if(!pd)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y,l=Math.hypot(dx,dy),m=Math.min(1,l/70);drag=l>6?{x:dx/l*m,y:dy/l*m}:{x:0,y:0}});
const endDrag=()=>{pd=null;drag=null};
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);
</script></body></html>
