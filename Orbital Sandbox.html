<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Orbital Sandbox</title>
<style>
  /* Layout: full-bleed starfield canvas with a floating glass control panel. */
  :root {
    --bg: #03040a;
    --fg: #e8ecff;
    --muted: rgba(232, 236, 255, 0.6);
    --accent: #7cf7ff;
    --glass: rgba(255, 255, 255, 0.07);
    --glass-border: rgba(255, 255, 255, 0.16);
    --hot: #ff4fb4;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    padding: 0;
  }
  canvas#sim {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; cursor: crosshair; touch-action: none;
  }
  #panel {
    position: fixed;
    top: max(18px, env(safe-area-inset-top, 0px));
    right: max(18px, env(safe-area-inset-right, 0px));
    width: min(248px, calc(100vw - 36px));
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 16px 16px 14px;
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    z-index: 10;
  }
  #panel h1 {
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    margin: 0 0 14px; font-weight: 600; color: var(--muted);
  }
  .row { margin-bottom: 14px; }
  .row label {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--muted); margin-bottom: 6px;
    font-variant-numeric: tabular-nums;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
  .btn {
    display: block; width: 100%; padding: 9px 10px; margin: 0 0 8px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--glass-border);
    border-radius: 11px;
    color: var(--fg); font: inherit; font-size: 12.5px; text-align: left;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .btn:hover { background: rgba(124, 247, 255, 0.14); border-color: rgba(124, 247, 255, 0.5); }
  .btn:focus-visible, .toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toggle {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12.5px; margin: 2px 0 12px; cursor: pointer;
    background: none; border: 0; color: var(--fg); font: inherit; width: 100%; padding: 0;
  }
  .switch {
    width: 36px; height: 20px; border-radius: 20px;
    background: rgba(255, 255, 255, 0.15); position: relative;
    transition: background 0.2s; flex: none;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; transition: transform 0.2s;
  }
  .toggle[aria-checked="true"] .switch { background: rgba(255, 79, 180, 0.7); }
  .toggle[aria-checked="true"] .switch::after { transform: translateX(16px); }
  #count {
    font-variant-numeric: tabular-nums; color: var(--muted);
    font-size: 11px; margin-top: 4px; text-align: center;
  }
  #hint {
    position: fixed;
    bottom: max(14px, env(safe-area-inset-bottom, 0px));
    left: 50%; transform: translateX(-50%);
    max-width: calc(100vw - 32px);
    font-size: 12px; color: var(--muted); pointer-events: none;
    background: var(--glass); padding: 6px 14px; border-radius: 12px;
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    text-align: center;
  }
  @media (prefers-reduced-motion: reduce) { .btn, .switch, .switch::after { transition: none; } }
</style>

<canvas id="sim" aria-label="Orbital simulation. Drag on space to launch a body."></canvas>

<div id="panel">
  <h1>Orbital Sandbox</h1>
  <div class="row">
    <label for="gravity"><span>Gravity strength</span><span id="gVal">1.00</span></label>
    <input type="range" id="gravity" min="0.2" max="3" step="0.05" value="1">
  </div>
  <button class="toggle" id="bhToggle" role="switch" aria-checked="false">
    <span>Black Hole Mode</span>
    <span class="switch" aria-hidden="true"></span>
  </button>
  <button class="btn" id="spawnSystem">Spawn stable solar system</button>
  <button class="btn" id="clearAll">Clear all bodies</button>
  <div id="count"></div>
</div>

<div id="hint">Drag on space to launch a body. Release to fire.</div>

<script>
(() => {
  const canvas = document.getElementById('sim');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  const G_BASE = 9000;     // gravitational constant (tuned for visuals)
  const SOFTEN = 14;       // softening length, avoids singularities
  const TRAIL_MAX = 220;
  const SUBSTEPS = 4;
  const LAUNCH_SCALE = 2.2;

  let gravityScale = 1;
  let blackHole = false;
  let sunId = null;
  const bodies = [];
  const particles = [];
  const stars = [];

  let dragging = false, dragStart = null, dragNow = null;
  let simTime = 0;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildStarfield();
  }

  function buildStarfield() {
    stars.length = 0;
    const n = Math.floor((W * H) / 2600);
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.2 + 0.2,
        a: Math.random() * 0.7 + 0.3,
        tw: Math.random() * Math.PI * 2
      });
    }
  }

  function makeBody(x, y, vx, vy, mass, opts = {}) {
    const b = {
      id: Math.random().toString(36).slice(2),
      x, y, vx, vy, m: mass,
      r: Math.cbrt(mass) * 0.9,
      hue: opts.hue ?? (160 + Math.random() * 180),
      trail: [],
      isSun: !!opts.isSun,
      fixed: !!opts.fixed,
      dead: false
    };
    bodies.push(b);
    return b;
  }

  function spawnSun() {
    const sun = makeBody(W / 2, H / 2, 0, 0, 1400, { isSun: true, fixed: true, hue: 45 });
    sun.r = 58;
    sunId = sun.id;
    applySunLook(sun);
    return sun;
  }

  function getSun() {
    return bodies.find(b => b.id === sunId) || null;
  }

  function applySunLook(sun) {
    if (!sun) return;
    if (blackHole) { sun.hue = 280; sun.r = 26; }
    else { sun.hue = 45; sun.r = 58; }
  }

  function clearAll() {
    bodies.length = 0;
    particles.length = 0;
    spawnSun();
    updateCount();
  }

  function spawnSolarSystem() {
    bodies.length = 0;
    particles.length = 0;
    const sun = spawnSun();
    const Gs = G_BASE * gravityScale;
    const specs = [
      { d: 110, m: 12, hue: 20 },
      { d: 170, m: 22, hue: 190 },
      { d: 250, m: 30, hue: 210 },
      { d: 340, m: 16, hue: 350 },
      { d: 430, m: 60, hue: 35 }
    ];
    for (const s of specs) {
      const ang = Math.random() * Math.PI * 2;
      const x = sun.x + Math.cos(ang) * s.d;
      const y = sun.y + Math.sin(ang) * s.d;
      const v = Math.sqrt(Gs * sun.m / s.d);   // circular orbit speed
      makeBody(x, y, -Math.sin(ang) * v, Math.cos(ang) * v, s.m, { hue: s.hue });
    }
    updateCount();
  }

  function setBlackHole(on) {
    blackHole = on;
    const t = document.getElementById('bhToggle');
    t.setAttribute('aria-checked', String(on));
    applySunLook(getSun());
  }

  function explode(x, y, hue, count, power) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = Math.random() * power + 20;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        decay: 0.6 + Math.random() * 0.9,   // per second
        size: Math.random() * 2.4 + 0.8,
        hue: hue + (Math.random() * 40 - 20)
      });
    }
  }

  // dt is in seconds
  function step(dt) {
    const Gs = G_BASE * gravityScale;
    const sub = dt / SUBSTEPS;

    for (let s = 0; s < SUBSTEPS; s++) {
      const n = bodies.length;
      const ax = new Float64Array(n);
      const ay = new Float64Array(n);
      for (let i = 0; i < n; i++) {
        const bi = bodies[i];
        if (bi.fixed) continue;
        for (let j = 0; j < n; j++) {
          if (i === j) continue;
          const bj = bodies[j];
          const dx = bj.x - bi.x, dy = bj.y - bi.y;
          const d2 = dx * dx + dy * dy + SOFTEN * SOFTEN;
          const inv = 1 / Math.sqrt(d2);
          const f = Gs * bj.m / d2;
          ax[i] += f * dx * inv;
          ay[i] += f * dy * inv;
        }
      }
      for (let i = 0; i < n; i++) {
        const b = bodies[i];
        if (b.fixed) continue;
        b.vx += ax[i] * sub;
        b.vy += ay[i] * sub;
        b.x += b.vx * sub;
        b.y += b.vy * sub;
      }
    }

    for (const b of bodies) {
      if (b.fixed) continue;
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > TRAIL_MAX) b.trail.shift();
    }

    const sun = getSun();
    if (blackHole && sun) {
      for (const b of bodies) {
        if (b === sun || b.dead) continue;
        const dx = b.x - sun.x, dy = b.y - sun.y;
        if (dx * dx + dy * dy < 34 * 34) {
          sun.m += b.m * 0.6;
          explode(b.x, b.y, 280, 18, 120);
          b.dead = true;
        }
      }
    }

    for (let i = 0; i < bodies.length; i++) {
      for (let j = i + 1; j < bodies.length; j++) {
        const a = bodies[i], b = bodies[j];
        if (a.dead || b.dead) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const rr = a.r + b.r;
        if (dx * dx + dy * dy >= rr * rr) continue;

        const big = a.m >= b.m ? a : b;
        const small = big === a ? b : a;

        if (big.fixed) {
          big.m += small.m;
          big.r = Math.cbrt(big.m) * 0.9;
          small.dead = true;
          explode(small.x, small.y, small.hue, 40, 180);
          continue;
        }

        // Merge by momentum and mass conservation.
        const total = a.m + b.m;
        const nvx = (a.vx * a.m + b.vx * b.m) / total;
        const nvy = (a.vy * a.m + b.vy * b.m) / total;
        const nx = (a.x * a.m + b.x * b.m) / total;
        const ny = (a.y * a.m + b.y * b.m) / total;
        const nhue = (a.hue * a.m + b.hue * b.m) / total;
        big.m = total;
        big.x = nx; big.y = ny; big.vx = nvx; big.vy = nvy;
        big.r = Math.cbrt(total) * 0.9;
        big.hue = nhue;
        small.dead = true;
        explode(nx, ny, nhue, 90, 260);
      }
    }

    for (let i = bodies.length - 1; i >= 0; i--) {
      if (bodies[i].dead) bodies.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= Math.pow(0.97, dt * 60);
      p.vy *= Math.pow(0.97, dt * 60);
      p.life -= p.decay * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = bodies.length - 1; i >= 0; i--) {
      const b = bodies[i];
      if (b.fixed) continue;
      if (b.x < -2000 || b.x > W + 2000 || b.y < -2000 || b.y > H + 2000) bodies.splice(i, 1);
    }

    updateCount();
  }

  function drawStarfield(t) {
    for (const s of stars) {
      const tw = 0.6 + 0.4 * Math.sin(t * 1.5 + s.tw);
      ctx.fillStyle = `rgba(200, 220, 255, ${s.a * tw})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawCorona(sun, t) {
    const pulse = 1 + Math.sin(t * 1.3) * 0.04;
    const R = sun.r;
    const outer = R * 6 * pulse;
    const g = ctx.createRadialGradient(sun.x, sun.y, R * 0.2, sun.x, sun.y, outer);
    if (blackHole) {
      g.addColorStop(0, 'rgba(0, 0, 0, 1)');
      g.addColorStop(0.35, 'rgba(0, 0, 0, 0.98)');
      g.addColorStop(0.5, 'rgba(255, 60, 190, 0.55)');
      g.addColorStop(0.7, 'rgba(120, 40, 255, 0.18)');
      g.addColorStop(1, 'rgba(0, 0, 0, 0)');
    } else {
      g.addColorStop(0, 'rgba(255, 250, 220, 1)');
      g.addColorStop(0.18, 'rgba(255, 220, 120, 0.9)');
      g.addColorStop(0.4, 'rgba(255, 150, 60, 0.35)');
      g.addColorStop(0.7, 'rgba(255, 90, 40, 0.12)');
      g.addColorStop(1, 'rgba(0, 0, 0, 0)');
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(sun.x, sun.y, outer, 0, Math.PI * 2);
    ctx.fill();

    if (blackHole) {
      ctx.save();
      ctx.translate(sun.x, sun.y);
      ctx.rotate(t * 0.6);
      ctx.scale(1, 0.32);
      const ring = ctx.createRadialGradient(0, 0, R * 0.9, 0, 0, R * 3.2);
      ring.addColorStop(0, 'rgba(255, 80, 200, 0)');
      ring.addColorStop(0.35, 'rgba(255, 90, 210, 0.9)');
      ring.addColorStop(0.6, 'rgba(160, 80, 255, 0.5)');
      ring.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.strokeStyle = ring;
      ctx.lineWidth = 18;
      ctx.beginPath();
      ctx.arc(0, 0, R * 2.1, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(sun.x, sun.y, R * 0.55, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(255, 255, 240, 0.95)';
      ctx.beginPath();
      ctx.arc(sun.x, sun.y, R * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Trails: additive neon strokes, fading from tail to head. No per-segment shadow blur (too costly).
  function drawTrail(b) {
    const t = b.trail;
    if (t.length < 2) return;
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 1; i < t.length; i++) {
      const k = i / t.length;
      ctx.strokeStyle = `hsla(${b.hue}, 100%, 62%, ${k * 0.55})`;
      ctx.lineWidth = 0.6 + k * 2.2;
      ctx.beginPath();
      ctx.moveTo(t[i - 1].x, t[i - 1].y);
      ctx.lineTo(t[i].x, t[i].y);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawBody(b) {
    if (b.isSun) return;
    const g = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.1, b.x, b.y, b.r);
    g.addColorStop(0, `hsl(${b.hue}, 90%, 85%)`);
    g.addColorStop(1, `hsl(${b.hue}, 80%, 40%)`);
    ctx.fillStyle = g;
    ctx.shadowColor = `hsl(${b.hue}, 100%, 60%)`;
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawParticles() {
    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      ctx.fillStyle = `hsla(${p.hue}, 100%, 65%, ${Math.max(p.life, 0)})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * Math.max(p.life, 0) + 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // Launch preview: dotted drag line plus a predicted path integrated under the current bodies.
  function drawPreview() {
    if (!dragging || !dragStart || !dragNow) return;
    const sx = dragStart.x, sy = dragStart.y;
    const vx = (sx - dragNow.x) * LAUNCH_SCALE;
    const vy = (sy - dragNow.y) * LAUNCH_SCALE;
    const Gs = G_BASE * gravityScale;

    ctx.save();
    ctx.setLineDash([3, 6]);
    ctx.strokeStyle = 'rgba(124, 247, 255, 0.8)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(dragNow.x, dragNow.y);
    ctx.stroke();

    let px = sx, py = sy, pvx = vx, pvy = vy;
    ctx.setLineDash([2, 5]);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.beginPath();
    ctx.moveTo(px, py);
    const h = 1 / 60;
    for (let k = 0; k < 600; k++) {
      let ax = 0, ay = 0;
      for (const b of bodies) {
        if (b.dead) continue;
        const dx = b.x - px, dy = b.y - py;
        const d2 = dx * dx + dy * dy + SOFTEN * SOFTEN;
        const inv = 1 / Math.sqrt(d2);
        const f = Gs * b.m / d2;
        ax += f * dx * inv;
        ay += f * dy * inv;
      }
      pvx += ax * h; pvy += ay * h;
      px += pvx * h; py += pvy * h;
      if (k % 3 === 0) ctx.lineTo(px, py);
      if (px < -200 || px > W + 200 || py < -200 || py > H + 200) break;
    }
    ctx.stroke();

    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(124, 247, 255, 0.9)';
    ctx.beginPath();
    ctx.arc(sx, sy, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function render(t) {
    ctx.fillStyle = '#03040a';
    ctx.fillRect(0, 0, W, H);

    const bg = ctx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.7);
    bg.addColorStop(0, 'rgba(30, 20, 70, 0.35)');
    bg.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    drawStarfield(t);
    for (const b of bodies) drawTrail(b);
    const sun = getSun();
    if (sun) drawCorona(sun, t);
    for (const b of bodies) drawBody(b);
    drawParticles();
    drawPreview();
  }

  function updateCount() {
    const planets = bodies.filter(b => !b.isSun).length;
    document.getElementById('count').textContent =
      `${planets} ${planets === 1 ? 'body' : 'bodies'} in orbit`;
  }

  canvas.addEventListener('pointerdown', e => {
    dragging = true;
    dragStart = { x: e.clientX, y: e.clientY };
    dragNow = { ...dragStart };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    dragNow = { x: e.clientX, y: e.clientY };
  });
  canvas.addEventListener('pointerup', e => {
    if (!dragging) return;
    dragging = false;
    const dx = dragStart.x - e.clientX, dy = dragStart.y - e.clientY;
    if (Math.hypot(dx, dy) >= 4) {
      const mass = 6 + Math.random() * 14;
      makeBody(dragStart.x, dragStart.y, dx * LAUNCH_SCALE, dy * LAUNCH_SCALE, mass);
      updateCount();
    }
    dragStart = dragNow = null;
  });
  canvas.addEventListener('pointercancel', () => {
    dragging = false;
    dragStart = dragNow = null;
  });

  document.getElementById('gravity').addEventListener('input', e => {
    gravityScale = parseFloat(e.target.value);
    document.getElementById('gVal').textContent = gravityScale.toFixed(2);
  });
  document.getElementById('bhToggle').addEventListener('click', () => setBlackHole(!blackHole));
  document.getElementById('clearAll').addEventListener('click', clearAll);
  document.getElementById('spawnSystem').addEventListener('click', spawnSolarSystem);
  window.addEventListener('resize', resize);

  resize();
  spawnSolarSystem();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    simTime += dt;
    step(dt);
    render(simTime);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body></html>
